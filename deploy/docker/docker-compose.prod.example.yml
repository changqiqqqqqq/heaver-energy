services:
  mysql:
    image: mysql:8.0
    container_name: heaver-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-heaver_energy}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/heaver-energy/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: heaver-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /data/heaver-energy/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ccr.ccs.tencentyun.com/heaver-energy-qic/heaver-api:20260722
    container_name: heaver-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/heaver-energy/app/services/api/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ccr.ccs.tencentyun.com/heaver-energy-qic/heaver-admin-web:20260722
    container_name: heaver-admin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
